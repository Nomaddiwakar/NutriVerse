<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NutriVerse Admin Command Center</title>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <style>
      :root {
        --bg-deep: oklch(0.06 0.015 270);
        --foreground: oklch(0.98 0.005 270);
        --foreground-muted: oklch(0.7 0.01 270);
        --border-light: oklch(1 0 0 / 0.08);
        --accent-cyan: oklch(0.75 0.14 195);
        --accent-cyan-glow: oklch(0.75 0.14 195 / 0.15);
        --accent-purple: oklch(0.68 0.22 290);
        --accent-purple-glow: oklch(0.68 0.22 290 / 0.15);
        --accent-magenta: oklch(0.65 0.25 340);
        --accent-magenta-glow: oklch(0.65 0.25 340 / 0.15);
        --accent-lime: oklch(0.85 0.18 140);
        --accent-lime-glow: oklch(0.85 0.18 140 / 0.15);
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-deep);
        color: var(--foreground);
        overflow-x: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/admin.tsx"></script>
  </body>
</html>
